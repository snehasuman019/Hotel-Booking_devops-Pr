
name: Hotel Booking CD Pipeline

on:
  workflow_run:
    workflows: ["Hotel Booking CI Pipeline"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy application through AWS SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          REMOTE_SCRIPT=$(cat <<'EOF'
          set -e
          sudo -u ubuntu -H bash -lc '
            set -e
            cd /home/ubuntu/Hotel-Booking_devops-Pr
            git pull origin main
            docker compose config -q
            docker compose up -d --build --no-deps api

            for i in $(seq 1 20); do
              if curl --fail http://127.0.0.1:8000/health; then
                echo "Deployment health check passed."
                docker compose ps
                exit 0
              fi
              sleep 3
            done

            echo "Health check failed."
            docker compose ps
            exit 1
          '
          EOF
          )
          PARAMETERS=$(jq -n --arg command "$REMOTE_SCRIPT" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Hotel Booking application" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|TimedOut|Cancelled)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID"
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment timed out while waiting for SSM."
          exit 1
